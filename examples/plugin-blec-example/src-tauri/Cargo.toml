[package]
name = "plugin-blec-example"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plugin_blec_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: loosened from the upstream example's exact "2.0.0"/"2.2.1" pins,
# which no longer match the npm-resolved @tauri-apps/api / plugin-shell
# versions (npm's own ranges float upward with time) and made `cargo tauri
# android build` refuse to run with a "mismatched Tauri packages" error.
# This is example-app scaffolding drift, unrelated to the plugin itself.
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1.40", features = ["log"] }
uuid = "1"

tauri-plugin-blec = { path = "../../../" }
tauri-plugin-log = "2"
